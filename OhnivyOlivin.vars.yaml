STORY_HTML: |-
  <p>Ohnivý Olivín je miniaturní Stromeček Štěstí, který se narodil v rodině Olivínových Štěstíček. Rozšiřující se rodinka obrůstá surové pecičky českého olivínovce (peridotitu) z lomu Smrčí.</p>
  <p>Ohnivý Olivín dělá čest svému jménu. První lístečky mu vyrašily u vodní dýmky… Od té doby nadšeně cestuje po městě i do přírody – a pokud je v okolí svíčka, vonná tyčinka či skutečný oheň, je spokojeně ve svém živlu.</p>
  <p>Ohnivý Olivín je jemný průvodce s láskyplnou energií. Díky svým minerálům i povaze vyzařuje radost, soucit a léčivou energii. Podporuje léčení emočních zranění, propojení s přírodními rytmy a nacházení vnitřní harmonie.</p>
