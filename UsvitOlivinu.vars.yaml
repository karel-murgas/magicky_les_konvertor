STORY_HTML: |-
  <p>Úsvit Olivínu je miniaturní Stromeček Štěstí, který se narodil v rodině Olivínových Štěstíček jako třetí v pořadí. Rodinka obrůstá surové pecičky českého olivínovce (peridotitu) z lomu Smrčí.</p>
  <p>Úsvit Olivínu má jemné lístky z citrínu – od těch nesvětlejších na vrcholku koruny po světle žluté. Pod korunou září srdce Stromu – krystal českého olivínu, taktéž nalezeného ve Smrčí.</p>
  <p>Úsvit Olivínu je milý průvodce s radostnou energií. Díky svým minerálům i povaze vyzařuje radost, soucit a léčivou energii. Podporuje léčení emočních zranění, propojení s přírodními rytmy a nacházení vnitřní harmonie.</p>
