SHORT_DESC: "Úsvit Olivínu je miniaturní Stromeček Štěstí, rostoucí na českém peridotitu z lomu Smrčí. Lakované měděné větvičky nesou lístky z citrínu, pod korunou je srdce z krystalu českého olivínu. Podporuje kreativitu a zdravou rovnováhu mezi rozumem a emocemi. S vysazeným Stromovým dvojčetem na příbramsku."
