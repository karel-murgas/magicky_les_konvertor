STORY_HTML: |-
  <p>Podzim Olivínu je miniaturní Stromeček Štěstí, který se narodil v rodině Olivínových Štěstíček. Tato rodinka obrůstá surové pecičky českého olivínovce (peridotitu) z lomu Smrčí.</p>
  <p>Podzim Olivínu má lístky z fasetovaných minerálních korálků rubínu a oranžového aventurínu, které připomínají barvy babího léta.</p>
  <p>Podzim Olivínu je podporující průvodce s radostnou energií. Díky svým minerálům i povaze vyzařuje radost, živost a podporu v tom jít si svou cestou. Posiluje propojení s přírodou a rostlinnou říší.</p>
