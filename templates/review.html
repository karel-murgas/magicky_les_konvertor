<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Review Variables</title></head>
  <body>
    <h1>Review variables for {{ product }}</h1>
    <form action="/render" method="post">
      {% for k in keys %}
      <div style="margin-bottom:8px">
        <label style="display:block;font-weight:bold">{{ k }}</label>
        {% set v = vars.get(k) %}
        {% if v is string %}
          <input type="text" name="{{ k }}" value="{{ v }}" style="width:90%" />
        {% else %}
          <textarea name="{{ k }}" rows="6" style="width:90%">{{ v }}</textarea>
        {% endif %}
      </div>
      {% endfor %}
      <h2>Rendered preview</h2>
      <div style="border:1px solid #ccc; padding:8px">{{ preview | safe }}</div>
      <button type="submit">Render</button>
    </form>
  </body>
</html>
