<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Template Renderer</title></head>
  <body>
    <h1>Upload _stare file</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
      <input type="file" name="file" />
      <button type="submit">Upload</button>
    </form>

    <h2>Existing files</h2>
    <ul>
      {% for f in files %}
      <li>{{ f }}</li>
      {% endfor %}
    </ul>
  </body>
</html>
